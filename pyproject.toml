[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freya-builder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["claude-agent-sdk==0.2.165", "python-dotenv==1.2.4", "jsonschema==4.26.0"]

[tool.setuptools.packages.find]
include = ["builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
